<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration · The LEGO Ninjago Animation Hub</title>
  <link rel="icon" href="https://i.imgur.com/V5Ntah6.jpeg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="container" id="shell">
  <header class="site-header">
    <div class="logo"><img src="https://i.imgur.com/V5Ntah6.jpeg" alt=""></div>
    <div class="grow"><h1>Administration</h1><p id="whoami">The LEGO Ninjago Animation Hub</p></div>
    <button id="logout" class="small secondary hidden" type="button">Log out</button>
  </header>

  <section id="adminLogin">
    <form id="adminLoginForm">
      <label>Admin username<input id="adminUsername" autocomplete="username" required></label>
      <label>Admin password<input id="adminPassword" type="password" autocomplete="current-password" required></label>
      <button type="submit">Log in</button>
      <p id="loginNotice" class="notice" aria-live="polite"></p>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div id="stats" class="stats"></div>
    <div class="tabs" role="tablist" id="adminTabs">
      <button class="tab active" type="button" data-tab="applications">Staff apps <span class="count hidden" data-count="pendingApplications"></span></button>
      <button class="tab" type="button" data-tab="members">Members</button>
      <button class="tab" type="button" data-tab="requests">Requests <span class="count hidden" data-count="pendingRequests"></span></button>
      <button class="tab" type="button" data-tab="minecraft">Minecraft <span class="count hidden" data-count="pendingMinecraft"></span></button>
      <button class="tab" type="button" data-tab="announcements">Announce</button>
      <button class="tab" type="button" data-tab="audit">Audit log</button>
      <button class="tab" type="button" data-tab="account">Account</button>
    </div>
    <p id="globalNotice" class="notice" aria-live="polite"></p>

    <section data-panel="applications"><div id="applications"></div></section>

    <section data-panel="members" class="hidden">
      <div class="toolbar">
        <input id="memberSearch" type="search" placeholder="Search name, Discord, rank…">
        <select id="memberFilter"><option value="">All statuses</option><option value="approved">Approved</option><option value="suspended">Suspended</option><option value="deactivated">Deactivated</option></select>
      </div>
      <div id="members"></div>
    </section>

    <section data-panel="requests" class="hidden">
      <div class="toolbar"><select id="requestFilter"><option value="pending">Pending</option><option value="">All requests</option><option value="approved">Approved</option><option value="denied">Denied</option></select></div>
      <div id="requests"></div>
    </section>

    <section data-panel="minecraft" class="hidden">
      <div class="toolbar"><select id="minecraftFilter"><option value="pending">Pending</option><option value="">All applications</option><option value="approved">Approved</option><option value="denied">Denied</option></select></div>
      <div id="minecraft"></div>
    </section>

    <section data-panel="announcements" class="hidden">
      <form id="announcementForm" class="card">
        <h2>Post announcement</h2>
        <label>Title<input id="announcementTitle" maxlength="100" required></label>
        <label>Message<textarea id="announcementMessage" maxlength="2000" required></textarea></label>
        <label class="check"><input type="checkbox" id="announcementDiscord" checked> Also post it in the Discord announcements channel</label>
        <button type="submit">Post announcement</button>
        <p id="announcementNotice" class="notice"></p>
      </form>
      <h3>Previous announcements</h3>
      <div id="announcements"></div>
    </section>

    <section data-panel="audit" class="hidden"><div id="audit"></div></section>

    <section data-panel="account" class="hidden">
      <form id="adminPasswordForm" class="card">
        <h2>Change your admin password</h2>
        <label>Current password<input id="adminCurrentPassword" type="password" autocomplete="current-password" required></label>
        <div class="grid">
          <label>New password<input id="adminNewPassword" type="password" autocomplete="new-password" minlength="12" required></label>
          <label>Confirm new password<input id="adminConfirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
        </div>
        <button type="submit">Change password</button>
        <p id="adminPasswordNotice" class="notice" aria-live="polite"></p>
      </form>
    </section>
  </section>
</main>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
